name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ycpss91255-docker/test-tools:latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        run: shellcheck -S warning bootstrap.sh

      - name: Bats integration tests
        run: bats test/integration/bootstrap_spec.bats
